ignore:
  resource_names:
    # # Model is not supported for HTTP APIs. Remove when adding support for WebSocket APIs
    - Model
    # IntegrationResponse is not supported for HTTP APIs. Remove when adding support for WebSocket APIs
    - IntegrationResponse
    # RouteResponse is not supported for HTTP APIs. Remove when adding support for WebSocket APIs
    - RouteResponse
  field_paths:
    # DomainNameStatus is ignored because it should be a read-only field
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.DomainNameStatus
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.DomainNameStatusMessage
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.ApiGatewayDomainName
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.CertificateUploadDate
    - CreateDomainNameInput.DomainNameConfigurations.DomainNameConfiguration.HostedZoneId

resources:
  Api:
    fields:
      Body:
        is_document: true
        from:
          operation: ImportApi
          path: Body
      Basepath:
        from:
          operation: ImportApi
          path: Basepath
      FailOnWarnings:
        from:
          operation: ImportApi
          path: FailOnWarnings
      Name:
        is_required: false
      ProtocolType:
        is_required: false
      CredentialsArn:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
    update_operation:
      custom_method_name: customUpdateApi
  Stage:
    hooks:
      sdk_update_post_build_request:
        template_path: hooks/stage/sdk_update_post_build_request.go.tpl
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      DeploymentId:
        references:
          resource: Deployment
          path: Status.DeploymentID
      # destinationArn below carries a reference, and both sdkCreate and
      # sdkUpdate wrote this struct back into the spec from the response, which
      # carries the resolved ARN but not the *Ref companion. No late_initialize
      # is needed: the struct has only destinationArn and format, both
      # user-supplied, and AWS returns nothing for it when access logging is off.
      AccessLogSettings:
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
      AccessLogSettings.DestinationArn:
        references:
          resource: LogGroup
          service_name: cloudwatchlogs
          path: Status.ACKResourceMetadata.ARN
  Authorizer:
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      AuthorizerCredentialsArn:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
    tags:
      ignore: true
  Deployment:
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
    tags:
      ignore: true
  Integration:
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      ConnectionId:
        references:
          resource: VPCLink
          path: Status.VPCLinkID
      CredentialsArn:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
    tags:
      ignore: true
  Route:
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      AuthorizerId:
        references:
          resource: Authorizer
          path: Status.AuthorizerID
      Target:
        references:
          resource: Integration
          path: Status.IntegrationID
    hooks:
      references_post_resolve:
        template_path: hooks/route/references_post_resolve.go.tpl
    tags:
      ignore: true
  VpcLink:
    fields:
      SubnetIds:
        references:
          resource: Subnet
          service_name: ec2
          path: Status.SubnetID
      SecurityGroupIds:
        references:
          resource: SecurityGroup
          service_name: ec2
          path: Status.ID
    hooks:
      sdk_update_pre_build_request:
        template_path: hooks/vpc_link/sdk_update_pre_build_request.go.tpl
    synced:
      when:
        - path: Status.VPCLinkStatus
          in:
            - AVAILABLE
  DomainName:
    exceptions:
      terminal_codes:
        - BadRequestException
    fields:
      # DomainNameStatus:
      #   is_read_only: true
      #   type: [string]
      # DomainNameStatusMessage:
      #   is_read_only: true
      #   type: string
      DomainName:
        is_primary_key: true
      # Both certificate ARNs below carry references, and both sdkCreate and
      # sdkUpdate wrote this list back into the spec from the response, which
      # carries the resolved ARNs but not the *Ref companions inside each item.
      # Suppressing the write-back also stops the AWS-assigned endpointType and
      # securityPolicy defaults from landing in the spec, which is what the
      # late_initialize entries below absorb instead.
    tags:
      ignore: true
  ApiMapping:
    exceptions:
      terminal_codes:
        - BadRequestException
    fields:
      ApiId:
        references:
          resource: API
          path: Status.APIID
      DomainName:
        references:
          resource: DomainName
          path: Spec.DomainName
    tags:
      ignore: true
operations:
  CreateApi:
    custom_implementation: customCreateApi
